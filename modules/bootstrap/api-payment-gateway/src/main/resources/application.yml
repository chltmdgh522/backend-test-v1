spring:
  datasource:
    url: jdbc:mariadb://43.201.27.162:3307/pgdb
    driver-class-name: org.mariadb.jdbc.Driver
    username: pguser
    password: pgpass
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

# 서버 설정
server:
  port: 8080

# 모니터링 설정
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: bigs
    web:
      server:
        request:
          autotime:
            enabled: true

# SpringDoc/Swagger 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
  show-actuator: false
  packages-to-scan: im.bigs.pg.api