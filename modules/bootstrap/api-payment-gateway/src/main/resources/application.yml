spring:
  datasource:
    url: jdbc:mariadb://db:3306/pgdb
    driver-class-name: org.mariadb.jdbc.Driver
    username: pguser
    password: pgpass
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: bigs
    web:
      server:
        request:
          autotime:
            enabled: true

